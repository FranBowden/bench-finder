services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - backend_node_modules:/app/backend/node_modules
    ports:
      - "3000:3000"
    # The named node_modules volume starts empty and shadows the packages
    # installed at image-build time, so install again once it's mounted.
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # See backend's comment above — same node_modules volume issue.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  backend_node_modules:
  frontend_node_modules:
